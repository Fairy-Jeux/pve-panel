name: Bug Report
description: Report a bug in the pve-panel FastAPI backend, embedded Web UI, Docker setup, or install.sh
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in **pve-panel**!
        Please **sanitize all secrets** (API tokens, passwords, `.p8` keys, `.env`, real Tailscale emails, or private IPs/hostnames) before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of pve-panel is affected?
      options:
        - Backend API (FastAPI)
        - Declarative Config (config.yaml / hot-reload)
        - Connectors / AlertEngine / Notifications
        - DualAuth Security (Tailscale SSO / Bearer / PIN)
        - Embedded Web UI (React / Vite)
        - Installer (install.sh) / Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Commands, API calls, or UI steps to trigger the issue.
      placeholder: |
        1. Configure ...
        2. Call endpoint / click ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment method and versions.
      placeholder: |
        - Deployment: Proxmox LXC (install.sh) / Docker Compose / Local dev
        - OS / Proxmox VE version:
        - Python / Node version (if local):
        - Commit SHA / tag:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs (Sanitized)
      description: Paste container or uvicorn logs with all tokens and personal info redacted.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to avoid duplicates.
          required: true
        - label: I removed all tokens, passwords, private keys, and personal hostnames/emails from logs.
          required: true
