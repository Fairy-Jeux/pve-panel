name: CI Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies & Ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff
      - name: Lint & syntax check (Ruff + compileall + import)
        run: |
          ruff check backend
          python -m compileall -q backend/app backend/tests
          PYTHONPATH=backend python -c "import app.main; print('APP_IMPORT_OK')"
      - name: Run pytest suite
        run: pytest -v
      - name: Validate install.sh syntax
        run: bash -n install.sh

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies, typecheck & build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  docker:
    name: Docker Multi-Stage Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build multi-stage Docker image
        run: docker build -t pve-panel:ci .
