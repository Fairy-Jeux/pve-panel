[project]
name = "pve-panel"
version = "1.0.0"
description = "PVE Command Center — Real-time FastAPI server, declarative config.yaml engine, AlertEngine, and embedded Liquid Glass Web UI for Proxmox VE homelabs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx[http2]>=0.27.2",
  "pyyaml>=6.0.2",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "watchfiles>=0.24.0",
  "zeroconf>=0.136.0",
  "PyJWT[crypto]>=2.9.0",
  "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend"]
extend-exclude = [".venv", "backend/.venv", "frontend"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]
