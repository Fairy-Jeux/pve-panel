# Optionnel : étiquettes et WWN pour associer vos disques /mnt/* aux infos SMART Proxmox.
# Si omis, les sous-dossiers montés dans /host_mnt sont détectés automatiquement.
storage_mounts:
  - mount: /mnt/disk1
    subpath: disk1
    wwn: "0x5000000000000001"
    label: Disque 4 To (Exemple)
  - mount: /mnt/disk2
    subpath: disk2
    wwn: "0x5000000000000002"
    label: Disque 2 To (Exemple)
